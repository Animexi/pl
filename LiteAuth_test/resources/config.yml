# LiteAuth Configuration
# Дизайн: жёлтый (§e) + белый (§f) + тёмно-серый (§8)

# ==================== ОСНОВНЫЕ НАСТРОЙКИ ====================

# Префикс всех сообщений
prefix: "§e§lLITE§f§lAUTH §8┃"

# Язык сообщений (ru/en)
language: "ru"

# ==================== БЕЗОПАСНОСТЬ ПАРОЛЕЙ ====================
password:
  # Минимальная длина пароля
  min-length: 6
  
  # Максимальная длина пароля
  max-length: 32
  
  # Запрещённые простые пароли
  blacklist:
    - "123456"
    - "password"
    - "qwerty"
    - "123123"
    - "admin"
    - "letmein"
    - "welcome"
    - "monkey"
    - "dragon"
    - "master"

# ==================== АВТОРИЗАЦИЯ ====================
auth:
  # Время на авторизацию в секундах (0 = отключено)
  timeout: 60
  
  # Максимальное количество попыток входа
  max-attempts: 5
  
  # Задержка между попытками (секунды)
  cooldown: 2
  
  # Время блокировки после превышения попыток (секунды)
  lock-time: 300
  
  # Отключать игрока при истечении времени
  kick-on-timeout: true

# ==================== РЕГИСТРАЦИЯ ====================
registration:
  # Включить регистрацию новых аккаунтов
  enabled: true
  
  # Максимум регистраций с одного IP (0 = без ограничений)
  max-per-ip: 3

# ==================== КАПЧА ====================
captcha:
  # Включить мини-капчу после регистрации
  enabled: true
  
  # Максимальное количество попыток ввода капчи
  max-attempts: 3
  
  # Время на прохождение капчи (секунды, 0 = отключено)
  timeout: 120
  
  # Требовать капчу при новой сессии
  on-new-session: false
  
  # Cooldown между запросами новой капчи (секунды)
  cooldown: 5

# ==================== АВТО-ЛОГИН И СЕССИИ ====================
session:
  # Включить автоматический вход по сессии
  auto-login: true
  
  # Время жизни сессии в секундах (86400 = 24 часа)
  lifetime: 86400
  
  # Использовать IP для проверки сессии
  by-ip: false

# ==================== ЗАЩИТА ДЕЙСТВИЙ ====================
protection:
  # Блокировка движения до авторизации
  move: true
  
  # Блокировка взаимодействия с блоками/сущностями
  interact: true
  
  # Блокировка разрушения блоков
  block-break: true
  
  # Блокировка установки блоков
  block-place: true
  
  # Блокировка получения/нанесения урона
  damage: true
  
  # Блокировка выброса предметов
  drop-item: true
  
  # Блокировка подбора предметов
  pickup-item: true
  
  # Блокировка открытия инвентаря
  inventory: true

# ==================== РАЗРЕШЁННЫЕ КОМАНДЫ ====================
# Команды, доступные до авторизации/прохождения капчи
allowed-commands:
  - "login"
  - "l"
  - "register"
  - "reg"
  - "captcha"
  - "auth"
  - "help"
  - "me"

# ==================== ЛОГИРОВАНИЕ ====================
logging:
  # Включить логирование событий
  enabled: true
  
  # Логировать события безопасности (попытки взлома и т.д.)
  security: true
  
  # Логировать действия администраторов
  admin-actions: true

# ==================== ОТЛАДКА ====================
debug: false

# ==================== ХРАНЕНИЕ ДАННЫХ ====================
storage:
  # Тип хранилища: yaml (файлы .yml в папке players/)
  type: "yaml"
