# LiteAuth Messages
# Дизайн: жёлтый (§e) + белый (§f) + тёмно-серый (§8)
# §a - успех, §c - ошибка, §7 - второстепенный текст

# ==================== ПРЕФИКС ====================
prefix: "§e§lLITE§f§lAUTH §8┃"

# ==================== РАМКИ ====================
border:
  top: "╔══════════════════════════════╗"
  side: "║"
  bottom: "╚══════════════════════════════╝"
  line: "━━━━━━━━━━━━━━━━━━━━"

