welcome:
  new: |
    ╔══════════════════════════════╗
    ║       §e§lLITEAUTH
    ║
    ║ §fДобро пожаловать на сервер.
    ║ §7Для продолжения необходимо
    ║ §7создать аккаунт.
    ║
    ║ §e/register <пароль> <пароль>
    ║
    ║ §7Пример: §f/register password123 password123
    ╚══════════════════════════════╝
  
  registered: |
    ╔══════════════════════════════╗
    ║       §e§lLITEAUTH
    ║
    ║ §fАккаунт найден.
    ║ §7Введите пароль для входа.
    ║
    ║ §e/login <пароль>
    ╚══════════════════════════════╝

