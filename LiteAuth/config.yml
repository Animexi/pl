# LiteAuth Configuration

# Password settings
min-password-length: 6
max-password-length: 32

# Timeout settings (in seconds)
auth-timeout: 60
captcha-timeout: 60

# Security settings
max-login-attempts: 5
login-delay: 1000
captcha-enabled: true
captcha-attempts: 3

# Session settings
auto-login: true
session-time: 86400
session-by-ip: false

# Registration settings
registration-enabled: true
max-registrations-per-ip: 3

# Kick settings
kick-on-timeout: true

# Blacklisted passwords
password-blacklist:
  - "123456"
  - "password"
  - "qwerty"
  - "123123"
  - "admin"
  - "server"

# Debug mode
debug: false
