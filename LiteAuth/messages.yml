# LiteAuth Messages
# Use {prefix} for plugin prefix
# Use {player} for player name
# Use color codes: §e (yellow), §f (white), §7 (gray), §8 (dark gray), §c (red), §a (green), §l (bold)

# Prefix for all messages
prefix: "§e§lLITE§f§lAUTH §8┃"

