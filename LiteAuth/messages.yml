welcome-unregistered: |
  ╔══════════════════════════════╗
  ║       §e§lLITEAUTH
  ║
  ║ §fДобро пожаловать на сервер.
  ║ §7Для продолжения необходимо
  ║ §7создать аккаунт.
  ║
  ║ §e/register <пароль> <пароль>
  ║
  ║ §7Пример: §f/register password password
  ╚══════════════════════════════╝

