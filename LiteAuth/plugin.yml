name: LiteAuth
version: 1.0.0
api: ["1.12.0", "1.13.0"]
main: LiteAuth\LiteAuthPlugin
author: LiteAuthTeam
description: Production-ready authentication system for Minecraft PE 1.1.5

commands:
  register:
    description: Register a new account
    aliases: [reg]
    usage: |
      §cНеверный формат команды.
      §7Используйте:
      §e/register §f<пароль> <пароль>
  login:
    description: Login to your account
    aliases: [l]
    usage: |
      §cНеверный формат команды.
      §7Используйте:
      §e/login §f<пароль>
  captcha:
    description: Solve captcha challenge
    usage: |
      §cНеверный формат команды.
      §7Используйте:
      §e/captcha §f<ответ>
  auth:
    description: Administration commands
    usage: |
      §cНеверный формат команды.
      §7Доступные подкоманды:
      §e/auth info <player>
      §e/auth unregister <player>
      §e/auth changepassword <player> <password>
      §e/auth logout <player>
      §e/auth reload

permissions:
  liteauth.admin:
    description: Allows using admin commands
    default: op
  liteauth.bypass:
    description: Bypass authentication requirements
    default: false
