name: LiteAuth
version: 1.0.0
api: ["3.0.0", "3.0.1", "3.0.2"]
main: LiteAuth\LiteAuthPlugin
author: LiteAuth Team
description: Advanced authentication system for Minecraft PE 1.1.5 (LiteCore)

commands:
  login:
    description: Login to your account
    aliases: [l]
  register:
    description: Register a new account
    aliases: [reg]
  captcha:
    description: Solve captcha verification
  auth:
    description: Authentication management commands

permissions:
  liteauth.admin:
    description: Admin access to LiteAuth commands
    default: op
  liteauth.bypass:
    description: Bypass authentication checks
    default: op
