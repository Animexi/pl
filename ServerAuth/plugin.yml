name: ServerAuth
version: 2.0.0
api:
  - 3.0.0
  - 4.0.0
main: ServerAuth\ServerAuthPlugin
author: ServerAuth Team
description: Полноценная система регистрации и авторизации для MCPE
website: https://github.com/serverauth

permissions:
  serverauth.admin:
    description: Полный доступ к административным командам
    default: op
  serverauth.reload:
    description: Перезагрузка конфигурации
    default: op
  serverauth.unregister:
    description: Удаление аккаунтов игроков
    default: op
  serverauth.info:
    description: Просмотр информации об игроке
    default: op
  serverauth.bypass:
    description: Обход авторизации
    default: false

commands:
  register:
    description: Регистрация нового аккаунта
    usage: /register <пароль> <повтор>
    permission: serverauth.register
  login:
    description: Вход в аккаунт
    usage: /login <пароль>
    permission: serverauth.login
  changepassword:
    description: Смена пароля
    usage: /changepassword <старый> <новый>
    permission: serverauth.changepassword
  auth:
    description: Административные команды
    usage: /auth <reload|unregister|info> [игрок]
    permission: serverauth.admin
