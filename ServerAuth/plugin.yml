name: ServerAuth
version: 1.0.0
api: ["3.0.0", "4.0.0"]
main: ServerAuth\ServerAuthPlugin
author: ServerAuth Team
description: Система регистрации и авторизации для PocketMine-MP (MCPE 1.1.5)
load: POSTWORLD

permissions:
  serverauth.admin:
    description: Полный доступ к административным командам ServerAuth
    default: op
  serverauth.reload:
    description: Перезагрузка конфигурации ServerAuth
    default: op
  serverauth.unregister:
    description: Удаление аккаунтов игроков
    default: op
  serverauth.info:
    description: Просмотр информации об аккаунте игрока
    default: op
  serverauth.register:
    description: Регистрация нового аккаунта
    default: true
  serverauth.login:
    description: Вход в аккаунт
    default: true
  serverauth.changepassword:
    description: Смена пароля
    default: true
