# ServerAuth Configuration
# Дизайн: тёмный + золотой + белый

# Префикс сообщений
prefix: "§8[§6Server§8]"

# ==================== БЕЗОПАСНОСТЬ ====================
security:
  # Максимальное количество попыток входа
  max_login_attempts: 5
  
  # Cooldown между попытками (секунды)
  login_cooldown: 3
  
  # Время блокировки после превышения попыток (секунды)
  lock_time: 300
  
  # Минимальная длина пароля
  min_password_length: 4
  
  # Максимальная длина пароля
  max_password_length: 20

# ==================== ЗАЩИТА ====================
protection:
  # Блокировка движения до авторизации
  move: true
  
  # Блокировка взаимодействия с блоками
  interact: true
  
  # Блокировка разрушения блоков
  block_break: true
  
  # Блокировка установки блоков
  block_place: true
  
  # Блокировка получения/нанесения урона
  damage: true
  
  # Блокировка выброса предметов
  drop_item: true

# ==================== РАЗРЕШЁННЫЕ КОМАНДЫ ====================
# Команды, доступные до авторизации
allowed_commands:
  - "login"
  - "register"
  - "changepassword"
  - "auth"

# ==================== СЕССИЯ ====================
# Автоматический logout при бездействии (0 = отключено, секунды)
session_timeout: 0

# ==================== ЛОГИРОВАНИЕ ====================
logging:
  # Включить логирование событий
  enabled: true

# ==================== ХРАНЕНИЕ ДАННЫХ ====================
storage:
  # Тип хранилища: file (JSON файлы)
  type: "file"
