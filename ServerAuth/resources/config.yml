# ServerAuth Configuration
# Полноценная система регистрации и авторизации

# Префикс сообщений
prefix: "§8[§6Server§8]"

# Цвета
colors:
  dark-gray: "§8"
  gray: "§7"
  white: "§f"
  gold: "§6"
  green: "§a"
  red: "§c"
  yellow: "§e"

# Настройки безопасности
security:
  # Минимальная длина пароля
  min-password-length: 4
  # Максимальная длина пароля
  max-password-length: 20
  # Максимальное количество попыток входа
  max-login-attempts: 5
  # Время блокировки после превышения попыток (в секундах)
  lockout-time: 300
  # Cooldown между попытками входа (в секундах)
  login-cooldown: 3
  # Время сессии после входа (в минутах, 0 = бессрочно до выхода)
  session-timeout: 0
  # Авто-вход по IP (если включено, игрок входит автоматически при совпадении IP)
  auto-login-by-ip: false
  # Авто-вход после регистрации (игрок не должен вводить /login отдельно)
  auto-login-after-register: true

# Настройки защиты до авторизации
protection:
  # Блокировать движение
  block-movement: true
  # Блокировать взаимодействие с блоками
  block-block-interaction: true
  # Блокировать получение урона
  block-damage: true
  # Блокировать нанесение урона
  block-damage-deal: true
  # Блокировать дроп предметов
  block-drop: true
  # Блокировать использование предметов
  block-item-use: true
  # Блокировать команды (кроме разрешенных)
  block-commands: true
  # Разрешенные команды до авторизации
  allowed-commands:
    - "login"
    - "register"
    - "changepassword"
    - "auth"
    - "help"
    - "me"
    - "tell"
    - "w"
    - "msg"
    - "whisper"

# Настройки хранилища
storage:
  # Тип хранилища (yaml, json, sqlite)
  type: "json"
  # Папка для хранения данных игроков
  players-folder: "players"
  # Автосохранение каждые N секунд (0 = отключено)
  auto-save-interval: 60

# Логирование
logging:
  # Логировать регистрацию
  log-registration: true
  # Логировать успешный вход
  log-successful-login: true
  # Логировать неудачный вход
  log-failed-login: true
  # Логировать блокировки
  log-lockouts: true
  # Логировать административные действия
  log-admin-actions: true

# Визуальные настройки
visual:
  # Показывать заголовок при входе
  show-welcome-title: true
  # Показывать подзаголовок при входе
  show-welcome-subtitle: true
  # Задержка перед показом приветствия (в тиках)
  welcome-delay: 20
  # Длительность показа заголовка (в тиках)
  title-fade-in: 10
  title-stay: 70
  title-fade-out: 20
