# ServerAuth Messages
# Все сообщения плагина с единым дизайном

# Префикс (может быть переопределен из config.yml)
prefix: "§8[§6Server§8]"

# Приветственные сообщения
welcome:
  # Для нового игрока (первый вход)
  new-player:
    - "§8§m--------------------------------"
    - "§6§l       SERVER AUTH"
    - "§8§m--------------------------------"
    - "§fДобро пожаловать на сервер."
    - ""
    - "§7Аккаунт: §6{PLAYER}"
    - ""
    - "§fДля начала зарегистрируйтесь:"
    - "§6/register <пароль> <повтор>"
    - ""
    - "§8§m--------------------------------"
  
  # Для зарегистрированного игрока
  registered-player:
    - "§8§m--------------------------------"
    - "§6§l       SERVER AUTH"
    - "§8§m--------------------------------"
    - "§fДобро пожаловать обратно."
    - ""
    - "§7Аккаунт: §6{PLAYER}"
    - ""
    - "§fДля продолжения авторизуйтесь:"
    - "§6/login <пароль>"
    - ""
    - "§8§m--------------------------------"
  
  # После успешной авторизации
  authorized:
    - "§8§m--------------------------------"
    - "§6§l       AUTHORIZED"
    - "§8§m--------------------------------"
    - "§aАвторизация успешно выполнена."
    - "§fПриятной игры, §6{PLAYER}§f."
    - ""
    - "§8§m--------------------------------"

# Сообщения регистрации
register:
  # Успешная регистрация
  success: "§8[§6Server§8] §aРегистрация успешно завершена. Теперь вы автоматически вошли в аккаунт."
  # Игрок уже зарегистрирован
  already-registered: "§8[§6Server§8] §cИгрок с таким именем уже зарегистрирован."
  # Пароли не совпадают
  passwords-mismatch: "§8[§6Server§8] §cПароли не совпадают."
  # Слишком короткий пароль
  password-too-short: "§8[§6Server§8] §cПароль слишком короткий. Минимум {MIN} символов."
  # Слишком длинный пароль
  password-too-long: "§8[§6Server§8] §cПароль слишком длинный. Максимум {MAX} символов."
  # Ошибка при регистрации
  error: "§8[§6Server§8] §cПроизошла ошибка при регистрации. Попробуйте позже."

# Сообщения входа
login:
  # Успешный вход
  success: "§8[§6Server§8] §aАвторизация выполнена успешно."
  # Неверный пароль
  wrong-password: "§8[§6Server§8] §cНеверный пароль."
  # Игрок не зарегистрирован
  not-registered: "§8[§6Server§8] §cВы еще не зарегистрированы. Используйте /register."
  # Игрок уже вошел
  already-logged-in: "§8[§6Server§8] §eВы уже авторизованы."
  # Слишком много попыток
  too-many-attempts: "§8[§6Server§8] §cСлишком много попыток. Повторите через {TIME} сек."
  # Cooldown между попытками
  cooldown: "§8[§6Server§8] §eПодождите {TIME} сек. перед следующей попыткой."
  # Авто-вход выполнен
  auto-login: "§8[§6Server§8] §aАвтоматический вход выполнен."

# Сообщения смены пароля
changepassword:
  # Успешная смена
  success: "§8[§6Server§8] §aПароль успешно изменен."
  # Неверный старый пароль
  wrong-old-password: "§8[§6Server§8] §cНеверный старый пароль."
  # Новый пароль совпадает со старым
  same-password: "§8[§6Server§8] §cНовый пароль не должен совпадать со старым."
  # Новый пароль слишком короткий
  new-password-too-short: "§8[§6Server§8] §cНовый пароль слишком короткий."
  # Новый пароль слишком длинный
  new-password-too-long: "§8[§6Server§8] §cНовый пароль слишком длинный."
  # Игрок не зарегистрирован
  not-registered: "§8[§6Server§8] §cВы еще не зарегистрированы."

# Сообщения защиты
protection:
  # Попытка движения до авторизации
  movement-blocked: "§8[§6Server§8] §eАвторизуйтесь для продолжения игры."
  # Попытка взаимодействия с блоками
  block-interaction-blocked: "§8[§6Server§8] §eАвторизуйтесь для взаимодействия с миром."
  # Попытка получения урона
  damage-blocked: "§8[§6Server§8] §eВы защищены от урона до авторизации."
  # Попытка нанесения урона
  damage-deal-blocked: "§8[§6Server§8] §eАвторизуйтесь для атаки."
  # Попытка дропа предмета
  drop-blocked: "§8[§6Server§8] §eАвторизуйтесь для использования предметов."
  # Использование команды заблокировано
  command-blocked: "§8[§6Server§8] §cЭта команда доступна только после авторизации."

# Административные сообщения
admin:
  # Перезагрузка конфигурации
  reload-success: "§8[§6Server§8] §aКонфигурация успешно перезагружена."
  # Ошибка при перезагрузке
  reload-error: "§8[§6Server§8] §cОшибка при перезагрузке конфигурации."
  # Аккаунт удален
  unregister-success: "§8[§6Server§8] §aАккаунт игрока {PLAYER} удален."
  # Игрок не найден
  player-not-found: "§8[§6Server§8] §cИгрок {PLAYER} не найден или не зарегистрирован."
  # Информация об игроке
  info-header: "§8§m--------------------------------"
  info-line: "§fИгрок: §6{PLAYER} §7| §fСтатус: §6{STATUS} §7| §fIP: §6{IP}"
  info-footer: "§8§m--------------------------------"
  # Недостаточно прав
  no-permission: "§8[§6Server§8] §cУ вас недостаточно прав для этой команды."
  # Использование команды
  usage: "§8[§6Server§8] §eИспользование: {USAGE}"

# Общие сообщения
general:
  # Команда доступна только игрокам
  player-only: "§8[§6Server§8] §cЭта команда доступна только игрокам."
  # Недостаточно аргументов
  not-enough-args: "§8[§6Server§8] §cНедостаточно аргументов."
  # Слишком много аргументов
  too-many-args: "§8[§6Server§8] §cСлишком много аргументов."
  # Ошибка
  error: "§8[§6Server§8] §cПроизошла ошибка. Попробуйте позже."
  # Игрок не найден
  player-not-found-general: "§8[§6Server§8] §cИгрок не найден."
