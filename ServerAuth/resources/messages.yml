# ServerAuth Messages
# Дизайн: тёмный (§8) + золотой (§6) + белый (§f)
# §a - успех, §c - ошибка, §e - предупреждение, §7 - второстепенный текст

# Префикс всех сообщений
prefix: "§8[§6Server§8]"

# ==================== ПРИВЕТСТВЕННЫЕ СООБЩЕНИЯ ====================
welcome:
  # Новый игрок (не зарегистрирован)
  new_message: |
    §8§m--------------------------------
    §6§l       SERVER AUTH
    §8§m--------------------------------
    §fДобро пожаловать на сервер.
    
    §7Аккаунт: §6{PLAYER}
    
    §fДля начала зарегистрируйтесь:
    §6/register <пароль> <повтор>
    
    §8§m--------------------------------
  
  # Зарегистрированный игрок
  registered_message: |
    §8§m--------------------------------
    §6§l       SERVER AUTH
    §8§m--------------------------------
    §fДобро пожаловать обратно.
    
    §7Аккаунт: §6{PLAYER}
    
    §fДля продолжения авторизуйтесь:
    §6/login <пароль>
    
    §8§m--------------------------------

# Сообщение после успешной авторизации
authorized: |
  §8§m--------------------------------
  §6§l       AUTHORIZED
  §8§m--------------------------------
  §aАвторизация успешно выполнена.
  §fПриятной игры, §6{PLAYER}§f.
  
  §8§m--------------------------------

# ==================== РЕГИСТРАЦИЯ ====================
register:
  usage: "§fДля регистрации используйте:\n§6/register <пароль> <повтор>"
  success: "§aРегистрация успешно завершена."
  already_registered: "§cИгрок с таким именем уже зарегистрирован."
  passwords_not_match: "§cПароли не совпадают."
  password_too_short: "§cПароль слишком короткий. Минимум {MIN_LENGTH} символов."
  password_too_long: "§cПароль слишком длинный. Максимум {MAX_LENGTH} символов."
  empty_password: "§cПароль не может быть пустым."

# ==================== АВТОРИЗАЦИЯ ====================
login:
  usage: "§fДля входа используйте:\n§6/login <пароль>"
  success: "§aАвторизация выполнена успешно."
  wrong_password: "§cНеверный пароль."
  not_registered: "§cВы не зарегистрированы. Используйте /register."
  already_logged_in: "§eВы уже авторизованы."
  too_many_attempts: "§cСлишком много попыток. Повторите позже."
  cooldown: "§eПодождите {SECONDS} сек. перед следующей попыткой."
  locked: "§cАккаунт заблокирован на {MINUTES} мин. из-за множества неудачных попыток."

# ==================== СМЕНА ПАРОЛЯ ====================
changepassword:
  usage: "§fДля смены пароля используйте:\n§6/changepassword <старый> <новый>"
  success: "§aПароль успешно изменён."
  wrong_old: "§cНеверный старый пароль."
  same_as_old: "§cНовый пароль совпадает со старым."

# ==================== ЗАЩИТА ====================
protection:
  move: "§cАвторизуйтесь для перемещения."
  interact: "§cАвторизуйтесь для взаимодействия."
  damage: "§cАвторизуйтесь для получения/нанесения урона."
  drop: "§cАвторизуйтесь для выброса предметов."
  command: "§cАвторизуйтесь для использования команд."

# ==================== АДМИНИСТРАТИВНЫЕ ====================
admin:
  reload_success: "§aКонфигурация перезагружена."
  unregister_success: "§aАккаунт игрока {PLAYER} удалён."
  unregister_not_found: "§cАккаунт не найден."
  info_header: "§fИнформация об аккаунте §6{PLAYER}"
  info_registered: "§7Зарегистрирован: §6{STATUS}"
  info_last_login: "§7Последний вход: §6{LAST_LOGIN}"
  no_permission: "§cУ вас нет прав для этой команды."

# ==================== ОШИБКИ ====================
error:
  player_not_found: "§cИгрок не найден."
  internal: "§cПроизошла внутренняя ошибка."
